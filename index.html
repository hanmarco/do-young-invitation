<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한도영 첫 생일 초대장</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg overflow-hidden relative">
        <img src="https://www.moumoon.kr/invite/bbd/images/top.webp" alt="초대장 상단" class="w-full">
        
        <div class="p-0 text-center relative">
            <div class="relative">
                <img src="https://www.moumoon.kr/invite/bbd/images/main_frame.webp" alt="초대장 메인 프레임" class="w-full my-4 relative" style="background-image: url('album2.jpg');background-size: cover; background-position: center center;">
                <img src="https://www.moumoon.kr/invite/bbd/images/obj_1.webp" alt="초대장 추가 이미지" class="w-full absolute bottom-[-120px] left-1/2 transform -translate-x-1/2">
            </div>
        </div>
        <div class="pt-20 text-center">
            <h1 class="text-2xl font-semibold text-gray-800">한도영</h1>
            <h1 class="text-2xl font-semibold text-lime-800">처음, 생일</h1>
            <p class="text-gray-600 mt-2">아빠 한상현, 엄마 이채희</p>
            <p class="text-gray-700 mt-2">2033년 09월 16일 (금) 오후 1시 30분</p>
            <p class="text-gray-700 mt-2">무문 파티, 경기 성남시 분당구 판교역로 146번길 20</p>
        </div>
        
        <div class="px-6 py-4">
            <h2 class="text-xl font-semibold text-gray-800">모시는 글</h2>
            <p class="text-gray-600 mt-2">하나의 작은 점으로 시작하여 열 달을 품고 작고 여려 품에 보듬기도 조심스러웠던 이 작은 아이로부터 엄마, 아빠로서의 삶을 배웁니다. 바쁘시더라도 참석하여 축복해주시면 큰 기쁨이 되겠습니다.</p>
        </div>

        <div class="px-6 py-4">
            <h2 class="text-xl font-semibold text-gray-800">갤러리</h2>
            <div class="grid grid-cols-2 gap-2 mt-2">
                <img class="w-full" src="album3.jpg" alt="갤러리 이미지">
                <img class="w-full" src="album4.jpg" alt="갤러리 이미지">
            </div>
        </div>

        <div class="px-6 py-4">
            <h2 class="text-xl font-semibold text-gray-800">오시는 길</h2>
            <p class="text-gray-600">경기 성남시 분당구 판교역로 146번길 20</p>
            <div class="mt-2">
                <a href="https://map.kakao.com/link/map/무문 파티,37.39279493027256,127.1120446864334" target="_blank" class="text-blue-500 underline">카카오맵 보기</a>
            </div>
        </div>

        <div class="px-6 py-4">
            <h2 class="text-xl font-semibold text-gray-800">참석 여부 전달</h2>
            <p class="text-gray-600">참석 여부를 알려주시면 감사하겠습니다.</p>
            <div class="mt-2">
                <a href="#" class="bg-blue-500 text-white px-4 py-2 rounded-lg">참석 여부 전달하기</a>
            </div>
        </div>
    </div>
</body>
</html>
